name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Token safety
        run: |
          if grep -R --line-number -E 'fav_(mcp|v0)_[A-Za-z0-9_-]{12,}' README.md src .github; then
            echo "Found what looks like a real FavCRM token. Use placeholders such as fav_mcp_..."
            exit 1
          fi


name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: x86_64-apple-darwin, runner: macos-13 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, ext: .exe }
    env:
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install cross target (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings

      - name: cargo test
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --locked --target "$TARGET"

      - name: cargo build
        run: cargo build --locked --release --target "$TARGET"

      - name: package
        shell: bash
        run: |
          name="favcrm-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/favcrm$EXT" "dist/$name/"
          cp README.md "dist/$name/" 2>/dev/null || true
          cp LICENSE "dist/$name/" 2>/dev/null || true
          if [[ "$TARGET" == *windows* ]]; then
            (cd dist && 7z a "$name.zip" "$name")
          else
            (cd dist && tar -czf "$name.tar.gz" "$name")
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip

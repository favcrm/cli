name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: x86_64-apple-darwin, runner: macos-13 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, ext: .exe }
    env:
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - name: verify tag matches Cargo.toml
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$cargo_version" != "${TAG#v}" ]; then
            echo "tag $TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install cross target (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings

      - name: cargo test
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --locked --target "$TARGET"

      - name: cargo build
        run: cargo build --locked --release --target "$TARGET"

      - name: package
        shell: bash
        run: |
          name="favcrm-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/favcrm$EXT" "dist/$name/"
          cp README.md "dist/$name/" 2>/dev/null || true
          cp LICENSE "dist/$name/" 2>/dev/null || true
          if [[ "$TARGET" == *windows* ]]; then
            (cd dist && 7z a "$name.zip" "$name")
            (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
          else
            (cd dist && tar -czf "$name.tar.gz" "$name")
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  homebrew:
    name: update homebrew tap
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - name: download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sha
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-apple-darwin.tar.gz.sha256' \
            --pattern '*-unknown-linux-gnu.tar.gz.sha256' \
            --dir sha

      - name: render formula
        run: |
          chmod +x packaging/homebrew/render.sh
          mkdir -p out
          packaging/homebrew/render.sh "$TAG" sha > out/favcrm.rb
          cat out/favcrm.rb

      - name: push to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/favcrm/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/favcrm.rb tap/Formula/favcrm.rb
          cd tap
          git config user.name "favcrm-bot"
          git config user.email "info@favcrm.io"
          git add Formula/favcrm.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "favcrm ${TAG#v}"
          git push

  npm:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p archives
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' --pattern '*.zip' --dir archives

      - name: build packages
        run: |
          chmod +x npm/build.sh
          npm/build.sh "$TAG" archives npm-dist

      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in npm-dist/cli-*; do
            (cd "$d" && npm publish --access public)
          done
          (cd npm-dist/cli && npm publish --access public)

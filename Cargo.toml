[package]
name = "favcrm"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "FavCRM CLI — talk to FavCRM from your terminal via the MCP API."
authors = ["FavCRM <info@favcrm.io>"]
license = "MIT"
repository = "https://github.com/favcrm/cli"
homepage = "https://favcrm.io"
readme = "README.md"
keywords = ["favcrm", "crm", "cli", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "favcrm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.16"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"
